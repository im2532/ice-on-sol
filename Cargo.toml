[workspace]
resolver = "2"
members = [
  "programs/peg_desk",
  "programs/fee_router",
  "programs/distributor",
  "programs/buyback",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/icemarkets-exchange/icemarkets"

[workspace.dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1" }
pyth-solana-receiver-sdk = "0.6.1"
# Meteora CPIs are built manually (programs/*/src/cpi_ext) so the workspace has no git deps.
# To switch to typed CPI later:
#   dynamic-bonding-curve = { git = "https://github.com/MeteoraAg/dynamic-bonding-curve", rev = "f552f20", features = ["cpi"] }
#   cp-amm = { git = "https://github.com/MeteoraAg/damm-v2", rev = "a85c926", features = ["cpi"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3
incremental = false

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
