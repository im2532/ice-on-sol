[workspace]
resolver = "2"
members = [
  "programs/peg_desk",
  "programs/fee_router",
  "programs/distributor",
  "programs/buyback",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/icemarkets-exchange/icemarkets"

[workspace.dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1" }
pyth-solana-receiver-sdk = "0.6.1"
# Meteora CPIs are built manually (programs/*/src/cpi_ext) so the workspace has no git deps.
# To switch to typed CPI later:
#   dynamic-bonding-curve = { git = "https://github.com/MeteoraAg/dynamic-bonding-curve", rev = "f552f20", features = ["cpi"] }
#   cp-amm = { git = "https://github.com/MeteoraAg/damm-v2", rev = "a85c926", features = ["cpi"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
# Size over speed: mainnet program rent is ≈ 6.96 SOL/MB, so bytecode is the single largest go-live cost
# (MAINNET_RUNBOOK §1). "z" trades some compute units for a smaller .so — `make sizes` after `anchor build`
# prints each program's size and rent; `anchor test` must still pass under the same CU limits (buyback
# convert_and_burn runs at 600k). Set OPT_LEVEL back to 3 here if a test trips a CU limit.
opt-level = "z"
incremental = false

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
