<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Submariner">
  <defs>
    <linearGradient id="SUBMARINER-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="SUBMARINER-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="SUBMARINER-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="SUBMARINER-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="SUBMARINER-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .SUBMARINER-sweep { animation: SUBMARINER-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes SUBMARINER-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .SUBMARINER-second { transform-origin: 128px 128px; animation: SUBMARINER-tick 6s steps(8) infinite; }
    @keyframes SUBMARINER-tick { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .SUBMARINER-sweep, .SUBMARINER-second { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#SUBMARINER-bg)" filter="url(#SUBMARINER-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#SUBMARINER-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph -->
  <circle cx="128" cy="128" r="46" fill="none" stroke="#FFFFFF" stroke-width="12"/>
  <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
    <line x1="128" y1="70" x2="128" y2="80"/>
    <line x1="128" y1="176" x2="128" y2="186"/>
    <line x1="70" y1="128" x2="80" y2="128"/>
    <line x1="176" y1="128" x2="186" y2="128"/>
    <line x1="88" y1="88" x2="95" y2="95"/>
    <line x1="168" y1="88" x2="161" y2="95"/>
    <line x1="88" y1="168" x2="95" y2="161"/>
    <line x1="168" y1="168" x2="161" y2="161"/>
  </g>
  <g class="SUBMARINER-hands" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round">
    <line x1="128" y1="128" x2="128" y2="96"/>
    <line x1="128" y1="128" x2="152" y2="128"/>
  </g>
  <g class="SUBMARINER-second">
    <line x1="128" y1="128" x2="128" y2="88" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>
  <circle cx="128" cy="128" r="6" fill="#FFFFFF"/>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#SUBMARINER-clip)">
    <rect class="SUBMARINER-sweep" x="0" y="0" width="80" height="256" fill="url(#SUBMARINER-sweep)"/>
  </g>
</svg>
