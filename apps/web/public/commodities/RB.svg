<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Gasoline">
  <defs>
    <linearGradient id="RB-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8C42"/>
      <stop offset="1" stop-color="#5B2ED6"/>
    </linearGradient>
    <linearGradient id="RB-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="RB-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="RB-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="RB-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .RB-sweep { animation: RB-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes RB-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .RB-glyph { transform-origin: 128px 128px; animation: RB-squeeze 2.8s ease-in-out infinite; }
    @keyframes RB-squeeze { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg); } }
    @media (prefers-reduced-motion: reduce) { .RB-sweep, .RB-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#RB-bg)" filter="url(#RB-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#RB-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: fuel pump nozzle -->
  <g class="RB-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84 84 H140 V104 H158 A20 20 0 0 1 178 124 V158"/>
    <path d="M96 104 V132 H78"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#RB-clip)">
    <rect class="RB-sweep" x="0" y="0" width="80" height="256" fill="url(#RB-sweep)"/>
  </g>
</svg>
