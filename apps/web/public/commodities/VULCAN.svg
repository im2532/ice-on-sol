<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Vulcan">
  <defs>
    <linearGradient id="VULCAN-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF9FF"/>
      <stop offset="1" stop-color="#B026FF"/>
    </linearGradient>
    <linearGradient id="VULCAN-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="VULCAN-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="VULCAN-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="VULCAN-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .VULCAN-sweep { animation: VULCAN-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes VULCAN-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .VULCAN-chevrons { animation: VULCAN-fire 2.2s ease-in-out infinite; }
    @keyframes VULCAN-fire { 0%, 100% { transform: translateX(0); opacity: 0.5; } 50% { transform: translateX(4px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .VULCAN-sweep, .VULCAN-chevrons { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#VULCAN-bg)" filter="url(#VULCAN-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#VULCAN-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph -->
  <g class="VULCAN-glyph">  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <rect x="58" y="105" width="34" height="26" rx="8"/>
    <rect x="78" y="101" width="64" height="34" rx="10"/>
    <line x1="142" y1="112" x2="194" y2="112"/>
    <line x1="192" y1="104" x2="192" y2="118"/>
    <line x1="85" y1="135" x2="70" y2="161"/>
    <path d="M125 135 Q140 150 150 172"/>
  </g>
  </g>
  <g class="VULCAN-chevrons" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M92 112 L102 118 L92 124"/>
    <path d="M106 112 L116 118 L106 124"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#VULCAN-clip)">
    <rect class="VULCAN-sweep" x="0" y="0" width="80" height="256" fill="url(#VULCAN-sweep)"/>
  </g>
</svg>
