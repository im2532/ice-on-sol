<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Howl">
  <defs>
    <linearGradient id="HOWL-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF9FF"/>
      <stop offset="1" stop-color="#B026FF"/>
    </linearGradient>
    <linearGradient id="HOWL-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="HOWL-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="HOWL-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="HOWL-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .HOWL-sweep { animation: HOWL-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes HOWL-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .HOWL-bite { animation: HOWL-flick 2.6s ease-in-out infinite; }
    @keyframes HOWL-flick { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .HOWL-sweep, .HOWL-bite { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#HOWL-bg)" filter="url(#HOWL-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#HOWL-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph -->
  <g class="HOWL-glyph">  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <rect x="58" y="105" width="34" height="26" rx="8"/>
    <rect x="78" y="101" width="64" height="34" rx="10"/>
    <line x1="142" y1="112" x2="194" y2="112"/>
    <line x1="192" y1="104" x2="192" y2="118"/>
    <line x1="85" y1="135" x2="70" y2="161"/>
    <path d="M125 135 Q140 150 150 172"/>
  </g>
  </g>
  <path class="HOWL-bite" d="M58 108 L68 118 L60 126 L70 134" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#HOWL-clip)">
    <rect class="HOWL-sweep" x="0" y="0" width="80" height="256" fill="url(#HOWL-sweep)"/>
  </g>
</svg>
