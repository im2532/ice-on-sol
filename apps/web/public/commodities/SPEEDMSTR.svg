<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Speedmaster">
  <defs>
    <linearGradient id="SPEEDMSTR-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="SPEEDMSTR-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="SPEEDMSTR-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="SPEEDMSTR-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="SPEEDMSTR-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .SPEEDMSTR-sweep { animation: SPEEDMSTR-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes SPEEDMSTR-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .SPEEDMSTR-second { transform-origin: 128px 128px; animation: SPEEDMSTR-tick 6s steps(8) infinite; }
    @keyframes SPEEDMSTR-tick { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .SPEEDMSTR-sweep, .SPEEDMSTR-second { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#SPEEDMSTR-bg)" filter="url(#SPEEDMSTR-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#SPEEDMSTR-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"><line x1="184.0" y1="128.0" x2="190.0" y2="128.0"/><line x1="182.1" y1="142.5" x2="187.9" y2="144.0"/><line x1="176.5" y1="156.0" x2="181.7" y2="159.0"/><line x1="167.6" y1="167.6" x2="171.8" y2="171.8"/><line x1="156.0" y1="176.5" x2="159.0" y2="181.7"/><line x1="142.5" y1="182.1" x2="144.0" y2="187.9"/><line x1="128.0" y1="184.0" x2="128.0" y2="190.0"/><line x1="113.5" y1="182.1" x2="112.0" y2="187.9"/><line x1="100.0" y1="176.5" x2="97.0" y2="181.7"/><line x1="88.4" y1="167.6" x2="84.2" y2="171.8"/><line x1="79.5" y1="156.0" x2="74.3" y2="159.0"/><line x1="73.9" y1="142.5" x2="68.1" y2="144.0"/><line x1="72.0" y1="128.0" x2="66.0" y2="128.0"/><line x1="73.9" y1="113.5" x2="68.1" y2="112.0"/><line x1="79.5" y1="100.0" x2="74.3" y2="97.0"/><line x1="88.4" y1="88.4" x2="84.2" y2="84.2"/><line x1="100.0" y1="79.5" x2="97.0" y2="74.3"/><line x1="113.5" y1="73.9" x2="112.0" y2="68.1"/><line x1="128.0" y1="72.0" x2="128.0" y2="66.0"/><line x1="142.5" y1="73.9" x2="144.0" y2="68.1"/><line x1="156.0" y1="79.5" x2="159.0" y2="74.3"/><line x1="167.6" y1="88.4" x2="171.8" y2="84.2"/><line x1="176.5" y1="100.0" x2="181.7" y2="97.0"/><line x1="182.1" y1="113.5" x2="187.9" y2="112.0"/></g>
  <circle cx="128" cy="128" r="46" fill="none" stroke="#FFFFFF" stroke-width="12"/>
  <g class="SPEEDMSTR-hands" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round">
    <line x1="128" y1="128" x2="128" y2="96"/>
    <line x1="128" y1="128" x2="152" y2="128"/>
  </g>
  <g class="SPEEDMSTR-second">
    <line x1="128" y1="128" x2="128" y2="88" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>
  <circle cx="128" cy="128" r="6" fill="#FFFFFF"/>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#SPEEDMSTR-clip)">
    <rect class="SPEEDMSTR-sweep" x="0" y="0" width="80" height="256" fill="url(#SPEEDMSTR-sweep)"/>
  </g>
</svg>
