<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Big Burger">
  <defs>
    <linearGradient id="BIGBURGER-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF6B2C"/>
    </linearGradient>
    <linearGradient id="BIGBURGER-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="BIGBURGER-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="BIGBURGER-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="BIGBURGER-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .BIGBURGER-sweep { animation: BIGBURGER-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes BIGBURGER-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .BIGBURGER-glyph { transform-origin: 128px 122px; animation: BIGBURGER-wave 3.2s ease-in-out infinite; }
    @keyframes BIGBURGER-wave { 0%, 100% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }
    @media (prefers-reduced-motion: reduce) { .BIGBURGER-sweep, .BIGBURGER-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#BIGBURGER-bg)" filter="url(#BIGBURGER-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#BIGBURGER-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: tall burger with lettuce wave -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 90 Q128 60 186 90"/>
    <path d="M66 108 H190"/>
    <path d="M66 140 H190"/>
    <path d="M62 156 H194"/>
    <path d="M64 178 Q128 200 192 178"/>
  </g>
  <g class="BIGBURGER-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 122 Q80 108 100 122 Q120 136 140 122 Q160 108 180 122 Q196 132 196 122"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#BIGBURGER-clip)">
    <rect class="BIGBURGER-sweep" x="0" y="0" width="80" height="256" fill="url(#BIGBURGER-sweep)"/>
  </g>
</svg>
