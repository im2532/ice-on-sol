<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Lumber">
  <defs>
    <linearGradient id="LBR-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B7F27B"/>
      <stop offset="1" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="LBR-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="LBR-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="LBR-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="LBR-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .LBR-sweep { animation: LBR-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes LBR-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .LBR-glyph { transform-origin: 129px 128px; animation: LBR-roll 3.4s ease-in-out infinite; }
    @keyframes LBR-roll { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .LBR-sweep, .LBR-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#LBR-bg)" filter="url(#LBR-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#LBR-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: two stacked logs end-on: circles with ring -->
  <g class="LBR-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="100" cy="152" r="34"/>
    <circle cx="100" cy="152" r="16"/>
    <circle cx="158" cy="104" r="30"/>
    <circle cx="158" cy="104" r="14"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#LBR-clip)">
    <rect class="LBR-sweep" x="0" y="0" width="80" height="256" fill="url(#LBR-sweep)"/>
  </g>
</svg>
