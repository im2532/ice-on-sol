<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Royal Oak">
  <defs>
    <linearGradient id="ROYALOAK-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="ROYALOAK-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="ROYALOAK-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ROYALOAK-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="ROYALOAK-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .ROYALOAK-sweep { animation: ROYALOAK-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes ROYALOAK-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .ROYALOAK-second { transform-origin: 128px 128px; animation: ROYALOAK-tick 6s steps(8) infinite; }
    @keyframes ROYALOAK-tick { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .ROYALOAK-sweep, .ROYALOAK-second { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#ROYALOAK-bg)" filter="url(#ROYALOAK-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#ROYALOAK-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph -->
  <polygon points="128.0,70.0 169.0,87.0 186.0,128.0 169.0,169.0 128.0,186.0 87.0,169.0 70.0,128.0 87.0,87.0" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
  <circle cx="128" cy="128" r="38" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  <g fill="#FFFFFF"><circle cx="128.0" cy="70.0" r="4" fill="#FFFFFF"/><circle cx="169.0" cy="87.0" r="4" fill="#FFFFFF"/><circle cx="186.0" cy="128.0" r="4" fill="#FFFFFF"/><circle cx="169.0" cy="169.0" r="4" fill="#FFFFFF"/><circle cx="128.0" cy="186.0" r="4" fill="#FFFFFF"/><circle cx="87.0" cy="169.0" r="4" fill="#FFFFFF"/><circle cx="70.0" cy="128.0" r="4" fill="#FFFFFF"/><circle cx="87.0" cy="87.0" r="4" fill="#FFFFFF"/></g>
  <g class="ROYALOAK-hands" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round">
    <line x1="128" y1="128" x2="128" y2="96"/>
    <line x1="128" y1="128" x2="152" y2="128"/>
  </g>
  <g class="ROYALOAK-second">
    <line x1="128" y1="128" x2="128" y2="88" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>
  <circle cx="128" cy="128" r="6" fill="#FFFFFF"/>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#ROYALOAK-clip)">
    <rect class="ROYALOAK-sweep" x="0" y="0" width="80" height="256" fill="url(#ROYALOAK-sweep)"/>
  </g>
</svg>
