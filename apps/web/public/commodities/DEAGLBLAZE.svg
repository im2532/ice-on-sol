<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Desert Eagle Blaze">
  <defs>
    <linearGradient id="DEAGLBLAZE-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF9FF"/>
      <stop offset="1" stop-color="#B026FF"/>
    </linearGradient>
    <linearGradient id="DEAGLBLAZE-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="DEAGLBLAZE-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="DEAGLBLAZE-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="DEAGLBLAZE-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .DEAGLBLAZE-sweep { animation: DEAGLBLAZE-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes DEAGLBLAZE-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .DEAGLBLAZE-flame { transform-origin: 206px 110px; animation: DEAGLBLAZE-flicker 2.4s ease-in-out infinite; }
    @keyframes DEAGLBLAZE-flicker { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.25); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .DEAGLBLAZE-sweep, .DEAGLBLAZE-flame { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#DEAGLBLAZE-bg)" filter="url(#DEAGLBLAZE-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#DEAGLBLAZE-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph -->
  <g class="DEAGLBLAZE-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <rect x="66" y="106" width="130" height="30" rx="8"/>
    <rect x="70" y="94" width="18" height="14" rx="4"/>
    <rect x="86" y="136" width="30" height="56" rx="10" transform="rotate(15 101 164)"/>
    <circle cx="132" cy="150" r="13"/>
  </g>
  <path class="DEAGLBLAZE-flame" d="M196 114 Q208 110 206 98 Q216 106 212 120 Q202 126 196 114 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#DEAGLBLAZE-clip)">
    <rect class="DEAGLBLAZE-sweep" x="0" y="0" width="80" height="256" fill="url(#DEAGLBLAZE-sweep)"/>
  </g>
</svg>
