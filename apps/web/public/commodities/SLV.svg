<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Silver">
  <defs>
    <linearGradient id="SLV-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1F3F8"/>
      <stop offset="1" stop-color="#9AA3B8"/>
    </linearGradient>
    <linearGradient id="SLV-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="SLV-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="SLV-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="SLV-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .SLV-sweep { animation: SLV-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes SLV-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .SLV-glyph { transform-origin: 128px 128px; animation: SLV-tilt 3.4s ease-in-out infinite; }
    @keyframes SLV-tilt { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-7deg); } }
    @media (prefers-reduced-motion: reduce) { .SLV-sweep, .SLV-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#SLV-bg)" filter="url(#SLV-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#SLV-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: coin with tilted ellipse rim -->
  <g class="SLV-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="128" cy="130" r="50"/>
    <ellipse cx="128" cy="130" rx="50" ry="16" transform="rotate(-18 128 130)"/>
    <path d="M100 96 L112 78" stroke-width="10"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#SLV-clip)">
    <rect class="SLV-sweep" x="0" y="0" width="80" height="256" fill="url(#SLV-sweep)"/>
  </g>
</svg>
