<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Burrito">
  <defs>
    <linearGradient id="BURRITO-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF6B2C"/>
    </linearGradient>
    <linearGradient id="BURRITO-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="BURRITO-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="BURRITO-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="BURRITO-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .BURRITO-sweep { animation: BURRITO-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes BURRITO-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .BURRITO-glyph { transform-origin: 128px 132px; animation: BURRITO-float 3.4s ease-in-out infinite; }
    @keyframes BURRITO-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { .BURRITO-sweep, .BURRITO-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#BURRITO-bg)" filter="url(#BURRITO-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#BURRITO-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: wrapped cylinder with diagonal fold lines -->
  <g class="BURRITO-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <rect x="66" y="106" width="124" height="52" rx="26"/>
    <path d="M66 106 L90 132 L66 158"/>
    <path d="M190 106 L166 132 L190 158"/>
    <path d="M100 106 L112 158"/>
    <path d="M144 106 L156 158"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#BURRITO-clip)">
    <rect class="BURRITO-sweep" x="0" y="0" width="80" height="256" fill="url(#BURRITO-sweep)"/>
  </g>
</svg>
