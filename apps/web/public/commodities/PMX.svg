<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Precious Metals Index">
  <defs>
    <linearGradient id="PMX-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9945FF"/>
      <stop offset="1" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="PMX-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="PMX-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="PMX-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="PMX-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .PMX-sweep { animation: PMX-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes PMX-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .PMX-glyph { transform-origin: 128px 128px; animation: PMX-rotate 3.8s ease-in-out infinite; }
    @keyframes PMX-rotate { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .PMX-sweep, .PMX-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#PMX-bg)" filter="url(#PMX-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#PMX-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: three overlapping hexagons -->
  <g class="PMX-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M112.0 78.0 L141.4 95.0 L141.4 129.0 L112.0 146.0 L82.6 129.0 L82.6 95.0 Z"/>
    <path d="M146.0 78.0 L175.4 95.0 L175.4 129.0 L146.0 146.0 L116.6 129.0 L116.6 95.0 Z"/>
    <path d="M129.0 118.0 L158.4 135.0 L158.4 169.0 L129.0 186.0 L99.6 169.0 L99.6 135.0 Z"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#PMX-clip)">
    <rect class="PMX-sweep" x="0" y="0" width="80" height="256" fill="url(#PMX-sweep)"/>
  </g>
</svg>
