<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Chicken Sandwich">
  <defs>
    <linearGradient id="CHIXSAND-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF6B2C"/>
    </linearGradient>
    <linearGradient id="CHIXSAND-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="CHIXSAND-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="CHIXSAND-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="CHIXSAND-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .CHIXSAND-sweep { animation: CHIXSAND-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes CHIXSAND-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .CHIXSAND-glyph { transform-origin: 128px 84px; animation: CHIXSAND-float 3.4s ease-in-out infinite; }
    @keyframes CHIXSAND-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { .CHIXSAND-sweep, .CHIXSAND-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#CHIXSAND-bg)" filter="url(#CHIXSAND-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#CHIXSAND-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: round bun with a pickle circle on top -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="128" cy="132" r="58"/>
    <path d="M76 150 H180"/>
    <circle cx="110" cy="104" r="4" fill="#FFFFFF" fill-opacity="0.9" stroke="none"/>
    <circle cx="146" cy="104" r="4" fill="#FFFFFF" fill-opacity="0.9" stroke="none"/>
  </g>
  <g class="CHIXSAND-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="128" cy="84" r="14"/>
    <path d="M128 78 V90"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#CHIXSAND-clip)">
    <rect class="CHIXSAND-sweep" x="0" y="0" width="80" height="256" fill="url(#CHIXSAND-sweep)"/>
  </g>
</svg>
