<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="WTI Crude">
  <defs>
    <linearGradient id="CL-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8C42"/>
      <stop offset="1" stop-color="#5B2ED6"/>
    </linearGradient>
    <linearGradient id="CL-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="CL-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="CL-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="CL-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .CL-sweep { animation: CL-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes CL-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .CL-glyph { transform-origin: 128px 128px; animation: CL-rock 3.4s ease-in-out infinite; }
    @keyframes CL-rock { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-5deg); } }
    @media (prefers-reduced-motion: reduce) { .CL-sweep, .CL-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#CL-bg)" filter="url(#CL-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#CL-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: barrel with two hoops -->
  <g class="CL-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M102 82 Q90 130 102 178 H154 Q166 130 154 82 Z"/>
    <path d="M94 108 Q128 118 162 108"/>
    <path d="M94 152 Q128 142 162 152"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#CL-clip)">
    <rect class="CL-sweep" x="0" y="0" width="80" height="256" fill="url(#CL-sweep)"/>
  </g>
</svg>
