<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="OSRS Gold">
  <defs>
    <linearGradient id="RSGP-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE066"/>
      <stop offset="1" stop-color="#C77A00"/>
    </linearGradient>
    <linearGradient id="RSGP-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="RSGP-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="RSGP-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="RSGP-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .RSGP-sweep { animation: RSGP-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes RSGP-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .RSGP-glyph { transform-origin: 128px 128px; animation: RSGP-shimmer 3.2s ease-in-out infinite; }
    @keyframes RSGP-shimmer { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { .RSGP-sweep, .RSGP-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#RSGP-bg)" filter="url(#RSGP-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#RSGP-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: stack of 3 pixel-style coins with stepped corners -->
  <g class="RSGP-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M108.0 130.0 H148.0 V142.0 H160.0 V166.0 H148.0 V178.0 H108.0 V166.0 H96.0 V142.0 H108.0 Z"/>
    <path d="M108.0 104.0 H148.0 V116.0 H160.0 V140.0 H148.0 V152.0 H108.0 V140.0 H96.0 V116.0 H108.0 Z"/>
    <path d="M108.0 78.0 H148.0 V90.0 H160.0 V114.0 H148.0 V126.0 H108.0 V114.0 H96.0 V90.0 H108.0 Z"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#RSGP-clip)">
    <rect class="RSGP-sweep" x="0" y="0" width="80" height="256" fill="url(#RSGP-sweep)"/>
  </g>
</svg>
