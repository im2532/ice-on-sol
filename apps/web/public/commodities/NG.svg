<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Natural Gas">
  <defs>
    <linearGradient id="NG-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A59"/>
      <stop offset="1" stop-color="#7A2FE0"/>
    </linearGradient>
    <linearGradient id="NG-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="NG-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="NG-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="NG-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .NG-sweep { animation: NG-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes NG-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .NG-glyph { transform-origin: 128px 128px; animation: NG-flicker 2.4s ease-in-out infinite; }
    @keyframes NG-flicker { 0%, 100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.05, 1.08) translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) { .NG-sweep, .NG-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#NG-bg)" filter="url(#NG-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#NG-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: flame -->
  <g class="NG-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 70 C104 100 92 122 92 146 A36 36 0 1 0 164 146 C164 122 152 100 128 70 Z"/>
    <path d="M128 118 C118 134 114 146 114 156 A14 14 0 0 0 142 156 C142 146 138 134 128 118 Z" fill="#FFFFFF" fill-opacity="0.9" stroke="none"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#NG-clip)">
    <rect class="NG-sweep" x="0" y="0" width="80" height="256" fill="url(#NG-sweep)"/>
  </g>
</svg>
