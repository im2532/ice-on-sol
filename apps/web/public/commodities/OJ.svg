<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Orange Juice">
  <defs>
    <linearGradient id="OJ-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="OJ-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="OJ-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="OJ-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="OJ-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .OJ-sweep { animation: OJ-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes OJ-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .OJ-glyph { transform-origin: 128px 130px; animation: OJ-spin 4s ease-in-out infinite; }
    @keyframes OJ-spin { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @media (prefers-reduced-motion: reduce) { .OJ-sweep, .OJ-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#OJ-bg)" filter="url(#OJ-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#OJ-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: orange slice with segments -->
  <g class="OJ-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="128" cy="130" r="62"/>
    <path d="M128 130 L128.0 72.0"/>
    <path d="M128 130 L178.2 101.0"/>
    <path d="M128 130 L178.2 159.0"/>
    <path d="M128 130 L128.0 188.0"/>
    <path d="M128 130 L77.8 159.0"/>
    <path d="M128 130 L77.8 101.0"/>
    <circle cx="128" cy="130" r="6" fill="#FFFFFF" fill-opacity="0.9" stroke="none"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#OJ-clip)">
    <rect class="OJ-sweep" x="0" y="0" width="80" height="256" fill="url(#OJ-sweep)"/>
  </g>
</svg>
