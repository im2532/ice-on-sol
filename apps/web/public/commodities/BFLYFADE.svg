<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Butterfly Fade">
  <defs>
    <linearGradient id="BFLYFADE-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF9FF"/>
      <stop offset="1" stop-color="#B026FF"/>
    </linearGradient>
    <linearGradient id="BFLYFADE-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="BFLYFADE-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="BFLYFADE-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="BFLYFADE-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .BFLYFADE-sweep { animation: BFLYFADE-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes BFLYFADE-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .BFLYFADE-left { transform-origin: 128px 160px; animation: BFLYFADE-openL 3.4s ease-in-out infinite; }
    .BFLYFADE-right { transform-origin: 128px 160px; animation: BFLYFADE-openR 3.4s ease-in-out infinite; }
    @keyframes BFLYFADE-openL { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-5deg); } }
    @keyframes BFLYFADE-openR { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(5deg); } }
    @media (prefers-reduced-motion: reduce) { .BFLYFADE-sweep, .BFLYFADE-left, .BFLYFADE-right { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#BFLYFADE-bg)" filter="url(#BFLYFADE-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#BFLYFADE-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph -->
  <g class="BFLYFADE-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M117 160 L122 70 L134 68 L139 160 Z"/>
    <circle cx="128" cy="160" r="10"/>
  </g>
  <g class="BFLYFADE-left"><line x1="128" y1="160" x2="86" y2="196" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/></g>
  <g class="BFLYFADE-right"><line x1="128" y1="160" x2="170" y2="196" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/></g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#BFLYFADE-clip)">
    <rect class="BFLYFADE-sweep" x="0" y="0" width="80" height="256" fill="url(#BFLYFADE-sweep)"/>
  </g>
</svg>
