<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Coffee">
  <defs>
    <linearGradient id="KC-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="KC-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="KC-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="KC-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="KC-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .KC-sweep { animation: KC-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes KC-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .KC-glyph { transform-origin: 128px 130px; animation: KC-wobble 3.4s ease-in-out infinite; }
    @keyframes KC-wobble { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @media (prefers-reduced-motion: reduce) { .KC-sweep, .KC-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#KC-bg)" filter="url(#KC-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#KC-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: coffee bean with center crease -->
  <g class="KC-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 66 C160 66 182 96 182 130 C182 164 160 194 128 194 C96 194 74 164 74 130 C74 96 96 66 128 66 Z"/>
    <path d="M128 70 C112 90 144 110 128 130 C112 150 144 170 128 190"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#KC-clip)">
    <rect class="KC-sweep" x="0" y="0" width="80" height="256" fill="url(#KC-sweep)"/>
  </g>
</svg>
