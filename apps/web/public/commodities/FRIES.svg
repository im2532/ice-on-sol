<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Fries">
  <defs>
    <linearGradient id="FRIES-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF6B2C"/>
    </linearGradient>
    <linearGradient id="FRIES-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="FRIES-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="FRIES-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="FRIES-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .FRIES-sweep { animation: FRIES-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes FRIES-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .FRIES-glyph { transform-origin: 128px 130px; animation: FRIES-float 3.4s ease-in-out infinite; }
    @keyframes FRIES-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { .FRIES-sweep, .FRIES-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#FRIES-bg)" filter="url(#FRIES-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#FRIES-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: fries carton with 4 fries fanning -->
  <g class="FRIES-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84 130 L96 190 H160 L172 130 Z"/>
    <path d="M80 130 H176"/>
    <path d="M104 130 L92 76"/>
    <path d="M118 130 L116 66"/>
    <path d="M138 130 L140 66"/>
    <path d="M152 130 L164 76"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#FRIES-clip)">
    <rect class="FRIES-sweep" x="0" y="0" width="80" height="256" fill="url(#FRIES-sweep)"/>
  </g>
</svg>
