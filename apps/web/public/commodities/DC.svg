<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Milk">
  <defs>
    <linearGradient id="DC-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="DC-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="DC-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="DC-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="DC-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .DC-sweep { animation: DC-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes DC-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .DC-glyph { transform-origin: 128px 130px; animation: DC-float 3.4s ease-in-out infinite; }
    @keyframes DC-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { .DC-sweep, .DC-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#DC-bg)" filter="url(#DC-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#DC-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: milk bottle/carton -->
  <g class="DC-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 110 V186 H164 V110 L128 78 Z"/>
    <path d="M92 110 L110 96 H146 L164 110"/>
    <path d="M100 150 H156"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#DC-clip)">
    <rect class="DC-sweep" x="0" y="0" width="80" height="256" fill="url(#DC-sweep)"/>
  </g>
</svg>
