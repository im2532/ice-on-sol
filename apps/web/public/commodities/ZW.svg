<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Wheat">
  <defs>
    <linearGradient id="ZW-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B7F27B"/>
      <stop offset="1" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="ZW-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="ZW-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ZW-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="ZW-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .ZW-sweep { animation: ZW-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes ZW-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .ZW-glyph { transform-origin: 128px 190px; animation: ZW-sway 3.6s ease-in-out infinite; }
    @keyframes ZW-sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @media (prefers-reduced-motion: reduce) { .ZW-sweep, .ZW-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#ZW-bg)" filter="url(#ZW-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#ZW-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: single ear of wheat swaying -->
  <g class="ZW-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 190 L128 78"/>
    <path d="M128 170 L104 156"/>
    <path d="M128 170 L152 156"/>
    <path d="M128 150 L108 136"/>
    <path d="M128 150 L148 136"/>
    <path d="M128 130 L110 118"/>
    <path d="M128 130 L146 118"/>
    <path d="M128 110 L112 100"/>
    <path d="M128 110 L144 100"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#ZW-clip)">
    <rect class="ZW-sweep" x="0" y="0" width="80" height="256" fill="url(#ZW-sweep)"/>
  </g>
</svg>
