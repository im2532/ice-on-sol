<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Live Cattle">
  <defs>
    <linearGradient id="LE-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB4C6"/>
      <stop offset="1" stop-color="#B23A5E"/>
    </linearGradient>
    <linearGradient id="LE-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="LE-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="LE-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="LE-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .LE-sweep { animation: LE-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes LE-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .LE-glyph { transform-origin: 128px 130px; animation: LE-nod 3.6s ease-in-out infinite; }
    @keyframes LE-nod { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .LE-sweep, .LE-glyph, .LE-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#LE-bg)" filter="url(#LE-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#LE-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: front-facing bull head with curved horns, ears, wide muzzle -->
  <g class="LE-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 96 H186 L162 176 H94 Z"/>
    <path d="M72 94 Q58 72 68 58"/>
    <path d="M184 94 Q198 72 188 58"/>
    <ellipse cx="68" cy="110" rx="12" ry="16" transform="rotate(-18 68 110)"/>
    <ellipse cx="188" cy="110" rx="12" ry="16" transform="rotate(18 188 110)"/>
    <circle cx="108" cy="126" r="6" fill="#FFFFFF" stroke="none"/>
    <circle cx="148" cy="126" r="6" fill="#FFFFFF" stroke="none"/>
    <rect x="100" y="150" width="56" height="28" rx="14"/>
    <circle cx="116" cy="164" r="4" fill="#FFFFFF" stroke="none"/>
    <circle cx="140" cy="164" r="4" fill="#FFFFFF" stroke="none"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#LE-clip)">
    <rect class="LE-sweep" x="0" y="0" width="80" height="256" fill="url(#LE-sweep)"/>
  </g>
</svg>
