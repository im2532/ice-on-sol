<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Pizza">
  <defs>
    <linearGradient id="PIZZA-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF6B2C"/>
    </linearGradient>
    <linearGradient id="PIZZA-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="PIZZA-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="PIZZA-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="PIZZA-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .PIZZA-sweep { animation: PIZZA-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes PIZZA-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .PIZZA-glyph { transform-origin: 128px 130px; animation: PIZZA-float 3.4s ease-in-out infinite; }
    @keyframes PIZZA-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { .PIZZA-sweep, .PIZZA-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#PIZZA-bg)" filter="url(#PIZZA-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#PIZZA-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: slice with 3 pepperoni dots -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 190 L74 90 Q128 74 182 90 Z"/>
  </g>
  <g class="PIZZA-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="110" cy="120" r="10"/>
    <circle cx="146" cy="120" r="10"/>
    <circle cx="128" cy="150" r="10"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#PIZZA-clip)">
    <rect class="PIZZA-sweep" x="0" y="0" width="80" height="256" fill="url(#PIZZA-sweep)"/>
  </g>
</svg>
