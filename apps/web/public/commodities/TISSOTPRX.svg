<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Tissot PRX">
  <defs>
    <linearGradient id="TISSOTPRX-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="TISSOTPRX-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="TISSOTPRX-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="TISSOTPRX-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="TISSOTPRX-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .TISSOTPRX-sweep { animation: TISSOTPRX-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes TISSOTPRX-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .TISSOTPRX-second { transform-origin: 128px 128px; animation: TISSOTPRX-tick 6s steps(8) infinite; }
    @keyframes TISSOTPRX-tick { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .TISSOTPRX-sweep, .TISSOTPRX-second { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#TISSOTPRX-bg)" filter="url(#TISSOTPRX-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#TISSOTPRX-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph -->
  <rect x="86" y="90" width="84" height="76" rx="20" fill="none" stroke="#FFFFFF" stroke-width="12"/>
  <g stroke="#FFFFFF" stroke-width="9" stroke-linecap="round">
    <line x1="100" y1="76" x2="100" y2="88"/>
    <line x1="128" y1="70" x2="128" y2="86"/>
    <line x1="156" y1="76" x2="156" y2="88"/>
    <line x1="100" y1="168" x2="100" y2="180"/>
    <line x1="128" y1="170" x2="128" y2="186"/>
    <line x1="156" y1="168" x2="156" y2="180"/>
  </g>
  <circle cx="128" cy="128" r="30" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <g class="TISSOTPRX-hands" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round">
    <line x1="128" y1="128" x2="128" y2="96"/>
    <line x1="128" y1="128" x2="152" y2="128"/>
  </g>
  <g class="TISSOTPRX-second">
    <line x1="128" y1="128" x2="128" y2="88" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>
  <circle cx="128" cy="128" r="6" fill="#FFFFFF"/>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#TISSOTPRX-clip)">
    <rect class="TISSOTPRX-sweep" x="0" y="0" width="80" height="256" fill="url(#TISSOTPRX-sweep)"/>
  </g>
</svg>
