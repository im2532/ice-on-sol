<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Taco">
  <defs>
    <linearGradient id="TACO-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF6B2C"/>
    </linearGradient>
    <linearGradient id="TACO-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="TACO-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="TACO-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="TACO-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .TACO-sweep { animation: TACO-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes TACO-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .TACO-glyph { transform-origin: 128px 190px; animation: TACO-rock 3.4s ease-in-out infinite; }
    @keyframes TACO-rock { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .TACO-sweep, .TACO-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#TACO-bg)" filter="url(#TACO-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#TACO-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: folded shell with filling zigzag -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 120 C70 160 95 190 128 190 C161 190 186 160 186 120"/>
    <path d="M82 118 C82 150 100 172 128 172 C156 172 174 150 174 118"/>
  </g>
  <g class="TACO-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M74 118 L92 100 L110 118 L128 100 L146 118 L164 100 L182 118"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#TACO-clip)">
    <rect class="TACO-sweep" x="0" y="0" width="80" height="256" fill="url(#TACO-sweep)"/>
  </g>
</svg>
