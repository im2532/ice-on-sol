<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Soybean Meal">
  <defs>
    <linearGradient id="ZM-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B7F27B"/>
      <stop offset="1" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="ZM-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="ZM-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ZM-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="ZM-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .ZM-sweep { animation: ZM-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes ZM-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .ZM-glyph { transform-origin: 128px 196px; animation: ZM-settle 3.6s ease-in-out infinite; }
    @keyframes ZM-settle { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.02); } }
    @media (prefers-reduced-motion: reduce) { .ZM-sweep, .ZM-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#ZM-bg)" filter="url(#ZM-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#ZM-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: sack with tied top -->
  <g class="ZM-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 100 C92 160 96 190 128 196 C160 190 164 160 164 100"/>
    <path d="M104 100 L128 76 L152 100"/>
    <path d="M98 140 H158"/>
    <circle cx="128" cy="76" r="6" fill="#FFFFFF" fill-opacity="0.9" stroke="none"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#ZM-clip)">
    <rect class="ZM-sweep" x="0" y="0" width="80" height="256" fill="url(#ZM-sweep)"/>
  </g>
</svg>
