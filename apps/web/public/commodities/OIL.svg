<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Oil Blend">
  <defs>
    <linearGradient id="OIL-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8C42"/>
      <stop offset="1" stop-color="#5B2ED6"/>
    </linearGradient>
    <linearGradient id="OIL-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="OIL-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="OIL-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="OIL-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .OIL-sweep { animation: OIL-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes OIL-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .OIL-glyph { transform-origin: 128px 128px; animation: OIL-slosh 3.2s ease-in-out infinite; }
    @keyframes OIL-slosh { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04, 0.97); } }
    @media (prefers-reduced-motion: reduce) { .OIL-sweep, .OIL-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#OIL-bg)" filter="url(#OIL-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#OIL-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: single droplet -->
  <g class="OIL-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 72 C150 102 168 128 168 152 A40 40 0 1 1 88 152 C88 128 106 102 128 72 Z"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#OIL-clip)">
    <rect class="OIL-sweep" x="0" y="0" width="80" height="256" fill="url(#OIL-sweep)"/>
  </g>
</svg>
