<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Oil Fund">
  <defs>
    <linearGradient id="USO-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8C42"/>
      <stop offset="1" stop-color="#5B2ED6"/>
    </linearGradient>
    <linearGradient id="USO-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="USO-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="USO-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="USO-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .USO-sweep { animation: USO-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes USO-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .USO-glyph { animation: none; }
    .USO-arrow { stroke-dasharray: 220; animation: USO-draw 3s ease-in-out infinite; }
    @keyframes USO-draw { 0% { stroke-dashoffset: 220; } 50%, 65% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -220; } }
    @media (prefers-reduced-motion: reduce) { .USO-sweep, .USO-glyph, .USO-arrow { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#USO-bg)" filter="url(#USO-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#USO-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: barrel with two hoops and a bold rising trend arrow -->
  <g class="USO-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <rect x="86" y="80" width="84" height="112" rx="16"/>
    <path d="M86 116 Q128 126 170 116"/>
    <path d="M86 160 Q128 150 170 160"/>
    <path class="USO-arrow" d="M76 176 L110 146 L134 160 L176 100"/>
    <path d="M158 104 L176 100 L172 120"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#USO-clip)">
    <rect class="USO-sweep" x="0" y="0" width="80" height="256" fill="url(#USO-sweep)"/>
  </g>
</svg>
