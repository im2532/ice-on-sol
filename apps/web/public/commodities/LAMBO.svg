<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Supercar">
  <defs>
    <linearGradient id="LAMBO-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5C7A"/>
      <stop offset="1" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="LAMBO-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="LAMBO-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="LAMBO-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="LAMBO-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .LAMBO-sweep { animation: LAMBO-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes LAMBO-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .LAMBO-glyph { transform-origin: 128px 128px; animation: LAMBO-bounce 2.8s ease-in-out infinite; }
    @keyframes LAMBO-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) { .LAMBO-sweep, .LAMBO-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#LAMBO-bg)" filter="url(#LAMBO-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#LAMBO-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: low wedge car side silhouette with two wheels -->
  <g class="LAMBO-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M68 162 L86 128 L112 114 L152 114 L180 134 L190 162 Z"/>
    <path d="M118 118 L146 118 L152 132 H114 Z"/>
    <circle cx="100" cy="166" r="16"/>
    <circle cx="168" cy="166" r="16"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#LAMBO-clip)">
    <rect class="LAMBO-sweep" x="0" y="0" width="80" height="256" fill="url(#LAMBO-sweep)"/>
  </g>
</svg>
