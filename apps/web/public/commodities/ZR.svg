<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Rice">
  <defs>
    <linearGradient id="ZR-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B7F27B"/>
      <stop offset="1" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="ZR-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="ZR-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ZR-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="ZR-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .ZR-sweep { animation: ZR-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes ZR-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .ZR-glyph { transform-origin: 128px 104px; animation: ZR-steam 3s ease-in-out infinite; }
    @keyframes ZR-steam { 0%, 100% { transform: translateY(0); opacity: 0.9; } 50% { transform: translateY(-6px); opacity: 0.45; } }
    @media (prefers-reduced-motion: reduce) { .ZR-sweep, .ZR-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#ZR-bg)" filter="url(#ZR-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#ZR-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: bowl with steam -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 138 Q80 176 128 176 Q176 176 176 138"/>
    <path d="M78 138 H178"/>
  </g>
  <g class="ZR-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 120 C104 108 116 100 110 88"/>
    <path d="M146 120 C140 108 152 100 146 88"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#ZR-clip)">
    <rect class="ZR-sweep" x="0" y="0" width="80" height="256" fill="url(#ZR-sweep)"/>
  </g>
</svg>
