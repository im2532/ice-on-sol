<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="CS2 Skins Index">
  <defs>
    <linearGradient id="CS2X-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9945FF"/>
      <stop offset="1" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="CS2X-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="CS2X-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="CS2X-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="CS2X-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .CS2X-sweep { animation: CS2X-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes CS2X-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .CS2X-glyph { transform-origin: 128px 128px; animation: CS2X-pulse 2.6s ease-in-out infinite; }
    @keyframes CS2X-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @media (prefers-reduced-motion: reduce) { .CS2X-sweep, .CS2X-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#CS2X-bg)" filter="url(#CS2X-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#CS2X-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: two overlapping hexagons with a small crosshair -->
  <g class="CS2X-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M108.0 92.0 L139.2 110.0 L139.2 146.0 L108.0 164.0 L76.8 146.0 L76.8 110.0 Z"/>
    <path d="M148.0 92.0 L179.2 110.0 L179.2 146.0 L148.0 164.0 L116.8 146.0 L116.8 110.0 Z"/>
    <circle cx="128" cy="128" r="14" stroke-width="6"/>
    <path d="M128 108 V118" stroke-width="6"/>
    <path d="M128 138 V148" stroke-width="6"/>
    <path d="M108 128 H118" stroke-width="6"/>
    <path d="M138 128 H148" stroke-width="6"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#CS2X-clip)">
    <rect class="CS2X-sweep" x="0" y="0" width="80" height="256" fill="url(#CS2X-sweep)"/>
  </g>
</svg>
