<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Latte">
  <defs>
    <linearGradient id="LATTE-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF6B2C"/>
    </linearGradient>
    <linearGradient id="LATTE-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="LATTE-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="LATTE-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="LATTE-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .LATTE-sweep { animation: LATTE-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes LATTE-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .LATTE-glyph { transform-origin: 128px 132px; animation: LATTE-pulse 3s ease-in-out infinite; }
    @keyframes LATTE-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { .LATTE-sweep, .LATTE-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#LATTE-bg)" filter="url(#LATTE-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#LATTE-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: tall cup with heart in foam -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84 96 L104 190 H152 L172 96 Z"/>
    <path d="M84 96 H172"/>
  </g>
  <g class="LATTE-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 122 C120 112 104 112 104 124 C104 134 116 142 128 152 C140 142 152 134 152 124 C152 112 136 112 128 122 Z"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#LATTE-clip)">
    <rect class="LATTE-sweep" x="0" y="0" width="80" height="256" fill="url(#LATTE-sweep)"/>
  </g>
</svg>
