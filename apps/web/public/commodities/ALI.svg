<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Aluminium">
  <defs>
    <linearGradient id="ALI-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9DDE7"/>
      <stop offset="1" stop-color="#6C7590"/>
    </linearGradient>
    <linearGradient id="ALI-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="ALI-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ALI-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="ALI-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .ALI-sweep { animation: ALI-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes ALI-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .ALI-glyph { transform-origin: 128px 128px; animation: ALI-fizz 3s ease-in-out infinite; }
    @keyframes ALI-fizz { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { .ALI-sweep, .ALI-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#ALI-bg)" filter="url(#ALI-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#ALI-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: soda can outline -->
  <g class="ALI-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <rect x="98" y="80" width="60" height="106" rx="12"/>
    <path d="M98 96 H158"/>
    <path d="M98 170 H158"/>
    <path d="M118 80 Q128 72 138 80" stroke-width="8"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#ALI-clip)">
    <rect class="ALI-sweep" x="0" y="0" width="80" height="256" fill="url(#ALI-sweep)"/>
  </g>
</svg>
