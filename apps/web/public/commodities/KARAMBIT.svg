<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Karambit">
  <defs>
    <linearGradient id="KARAMBIT-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF9FF"/>
      <stop offset="1" stop-color="#B026FF"/>
    </linearGradient>
    <linearGradient id="KARAMBIT-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="KARAMBIT-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="KARAMBIT-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="KARAMBIT-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .KARAMBIT-sweep { animation: KARAMBIT-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes KARAMBIT-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .KARAMBIT-glint { animation: KARAMBIT-shine 3s ease-in-out infinite; }
    @keyframes KARAMBIT-shine { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .KARAMBIT-sweep, .KARAMBIT-glint { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#KARAMBIT-bg)" filter="url(#KARAMBIT-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#KARAMBIT-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph -->
  <g class="KARAMBIT-glyph" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 182 Q66 150 82 106 Q94 76 128 72 Q158 74 166 100"/>
    <circle cx="104" cy="182" r="16"/>
  </g>
  <path class="KARAMBIT-glint" d="M104 96 Q120 90 136 96" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#KARAMBIT-clip)">
    <rect class="KARAMBIT-sweep" x="0" y="0" width="80" height="256" fill="url(#KARAMBIT-sweep)"/>
  </g>
</svg>
