<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Bacon Burger">
  <defs>
    <linearGradient id="BACONBRGR-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF6B2C"/>
    </linearGradient>
    <linearGradient id="BACONBRGR-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="BACONBRGR-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="BACONBRGR-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="BACONBRGR-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .BACONBRGR-sweep { animation: BACONBRGR-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes BACONBRGR-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .BACONBRGR-glyph { transform-origin: 178px 133px; animation: BACONBRGR-wiggle 2.8s ease-in-out infinite; }
    @keyframes BACONBRGR-wiggle { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
    @media (prefers-reduced-motion: reduce) { .BACONBRGR-sweep, .BACONBRGR-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#BACONBRGR-bg)" filter="url(#BACONBRGR-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#BACONBRGR-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: burger with bacon wave sticking out -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 96 Q128 66 178 96"/>
    <path d="M74 112 H182"/>
    <path d="M70 128 Q128 142 186 128"/>
    <path d="M72 146 H184"/>
    <path d="M70 146 Q128 176 186 146"/>
  </g>
  <g class="BACONBRGR-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M178 118 Q198 122 178 132 Q198 138 178 148"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#BACONBRGR-clip)">
    <rect class="BACONBRGR-sweep" x="0" y="0" width="80" height="256" fill="url(#BACONBRGR-sweep)"/>
  </g>
</svg>
