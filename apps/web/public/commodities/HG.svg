<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Copper">
  <defs>
    <linearGradient id="HG-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8A868"/>
      <stop offset="1" stop-color="#8A4B1E"/>
    </linearGradient>
    <linearGradient id="HG-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="HG-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="HG-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="HG-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .HG-sweep { animation: HG-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes HG-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .HG-glyph { transform-origin: 128px 128px; animation: HG-uncoil 3.4s ease-in-out infinite; }
    @keyframes HG-uncoil { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(10deg); } }
    @media (prefers-reduced-motion: reduce) { .HG-sweep, .HG-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#HG-bg)" filter="url(#HG-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#HG-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: coiled wire spiral -->
  <g class="HG-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M172 132 A42 42 0 1 1 128 90"/>
    <path d="M128 90 A28 28 0 1 1 100 118"/>
    <path d="M100 118 A16 16 0 1 1 126 132"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#HG-clip)">
    <rect class="HG-sweep" x="0" y="0" width="80" height="256" fill="url(#HG-sweep)"/>
  </g>
</svg>
