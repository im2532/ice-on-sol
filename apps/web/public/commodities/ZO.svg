<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Oats">
  <defs>
    <linearGradient id="ZO-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B7F27B"/>
      <stop offset="1" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="ZO-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="ZO-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ZO-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="ZO-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .ZO-sweep { animation: ZO-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes ZO-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .ZO-glyph { transform-origin: 128px 190px; animation: ZO-sway 3.6s ease-in-out infinite; }
    @keyframes ZO-sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .ZO-sweep, .ZO-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#ZO-bg)" filter="url(#ZO-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#ZO-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: oat stalk with hanging grains -->
  <g class="ZO-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 190 C126 150 130 110 128 90"/>
    <path d="M128 100 Q145 104 152 118"/>
    <circle cx="152" cy="122" r="9"/>
    <path d="M128 120 Q111 124 104 138"/>
    <circle cx="104" cy="142" r="9"/>
    <path d="M128 140 Q145 144 152 158"/>
    <circle cx="152" cy="162" r="9"/>
    <path d="M128 160 Q111 164 104 178"/>
    <circle cx="104" cy="182" r="9"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#ZO-clip)">
    <rect class="ZO-sweep" x="0" y="0" width="80" height="256" fill="url(#ZO-sweep)"/>
  </g>
</svg>
