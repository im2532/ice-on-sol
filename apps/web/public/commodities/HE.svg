<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Lean Hogs">
  <defs>
    <linearGradient id="HE-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB4C6"/>
      <stop offset="1" stop-color="#B23A5E"/>
    </linearGradient>
    <linearGradient id="HE-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="HE-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="HE-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="HE-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .HE-sweep { animation: HE-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes HE-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .HE-glyph { animation: none; }
    .HE-snout { animation: HE-wiggle 2.6s ease-in-out infinite; }
    @keyframes HE-wiggle { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
    @media (prefers-reduced-motion: reduce) { .HE-sweep, .HE-glyph, .HE-snout { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#HE-bg)" filter="url(#HE-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#HE-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: round pig face with triangular ears and big snout -->
  <g class="HE-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="128" cy="132" r="56"/>
    <path d="M92 88 L76 60 L104 82 Z"/>
    <path d="M164 88 L180 60 L152 82 Z"/>
    <circle cx="108" cy="118" r="5" fill="#FFFFFF" stroke="none"/>
    <circle cx="148" cy="118" r="5" fill="#FFFFFF" stroke="none"/>
    <g class="HE-snout" style="transform-origin:128px 156px;">
      <ellipse cx="128" cy="156" rx="30" ry="22"/>
      <circle cx="120" cy="156" r="4" fill="#FFFFFF" stroke="none"/>
      <circle cx="136" cy="156" r="4" fill="#FFFFFF" stroke="none"/>
    </g>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#HE-clip)">
    <rect class="HE-sweep" x="0" y="0" width="80" height="256" fill="url(#HE-sweep)"/>
  </g>
</svg>
