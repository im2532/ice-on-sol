<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Glock Fade">
  <defs>
    <linearGradient id="GLOCKFADE-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF9FF"/>
      <stop offset="1" stop-color="#B026FF"/>
    </linearGradient>
    <linearGradient id="GLOCKFADE-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="GLOCKFADE-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="GLOCKFADE-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="GLOCKFADE-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .GLOCKFADE-sweep { animation: GLOCKFADE-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes GLOCKFADE-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .GLOCKFADE-fade { animation: GLOCKFADE-pulse 3s ease-in-out infinite; }
    @keyframes GLOCKFADE-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.95; } }
    @media (prefers-reduced-motion: reduce) { .GLOCKFADE-sweep, .GLOCKFADE-fade { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#GLOCKFADE-bg)" filter="url(#GLOCKFADE-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#GLOCKFADE-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph -->
  <g class="GLOCKFADE-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <rect x="76" y="104" width="110" height="34" rx="10"/>
    <rect x="93" y="138" width="34" height="60" rx="10" transform="rotate(15 110 168)"/>
    <circle cx="140" cy="150" r="14"/>
  </g>
  <g class="GLOCKFADE-fade" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="150" y1="112" x2="150" y2="130"/>
    <line x1="162" y1="112" x2="162" y2="130"/>
    <line x1="174" y1="112" x2="174" y2="130"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#GLOCKFADE-clip)">
    <rect class="GLOCKFADE-sweep" x="0" y="0" width="80" height="256" fill="url(#GLOCKFADE-sweep)"/>
  </g>
</svg>
