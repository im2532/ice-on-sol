<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Coffee Cup">
  <defs>
    <linearGradient id="MEDCOFFEE-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF6B2C"/>
    </linearGradient>
    <linearGradient id="MEDCOFFEE-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="MEDCOFFEE-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="MEDCOFFEE-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="MEDCOFFEE-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .MEDCOFFEE-sweep { animation: MEDCOFFEE-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes MEDCOFFEE-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .MEDCOFFEE-glyph { transform-origin: 128px 83px; animation: MEDCOFFEE-steam 3s ease-in-out infinite; }
    @keyframes MEDCOFFEE-steam { 0%, 100% { transform: translateY(0); opacity: 0.9; } 50% { transform: translateY(-6px); opacity: 0.45; } }
    @media (prefers-reduced-motion: reduce) { .MEDCOFFEE-sweep, .MEDCOFFEE-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#MEDCOFFEE-bg)" filter="url(#MEDCOFFEE-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#MEDCOFFEE-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: takeaway cup with lid and steam -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 120 L104 190 H152 L164 120 Z"/>
    <path d="M86 120 H170"/>
    <path d="M92 108 H164"/>
  </g>
  <g class="MEDCOFFEE-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M116 96 C110 86 120 80 114 70"/>
    <path d="M142 96 C136 86 146 80 140 70"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#MEDCOFFEE-clip)">
    <rect class="MEDCOFFEE-sweep" x="0" y="0" width="80" height="256" fill="url(#MEDCOFFEE-sweep)"/>
  </g>
</svg>
