<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Santos">
  <defs>
    <linearGradient id="SANTOS-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="SANTOS-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="SANTOS-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="SANTOS-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="SANTOS-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .SANTOS-sweep { animation: SANTOS-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes SANTOS-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .SANTOS-second { transform-origin: 128px 128px; animation: SANTOS-tick 6s steps(8) infinite; }
    @keyframes SANTOS-tick { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .SANTOS-sweep, .SANTOS-second { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#SANTOS-bg)" filter="url(#SANTOS-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#SANTOS-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph -->
  <rect x="80" y="80" width="96" height="96" rx="10" fill="none" stroke="#FFFFFF" stroke-width="12"/>
  <g fill="#FFFFFF">
    <circle cx="88" cy="88" r="5"/><circle cx="168" cy="88" r="5"/>
    <circle cx="88" cy="168" r="5"/><circle cx="168" cy="168" r="5"/>
  </g>
  <g class="SANTOS-hands" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round">
    <line x1="128" y1="128" x2="128" y2="96"/>
    <line x1="128" y1="128" x2="152" y2="128"/>
  </g>
  <g class="SANTOS-second">
    <line x1="128" y1="128" x2="128" y2="88" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>
  <circle cx="128" cy="128" r="6" fill="#FFFFFF"/>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#SANTOS-clip)">
    <rect class="SANTOS-sweep" x="0" y="0" width="80" height="256" fill="url(#SANTOS-sweep)"/>
  </g>
</svg>
