<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Nuggets">
  <defs>
    <linearGradient id="NUGGETS-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF6B2C"/>
    </linearGradient>
    <linearGradient id="NUGGETS-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="NUGGETS-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="NUGGETS-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="NUGGETS-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .NUGGETS-sweep { animation: NUGGETS-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes NUGGETS-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .NUGGETS-glyph { transform-origin: 128px 128px; animation: NUGGETS-float 3.4s ease-in-out infinite; }
    @keyframes NUGGETS-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { .NUGGETS-sweep, .NUGGETS-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#NUGGETS-bg)" filter="url(#NUGGETS-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#NUGGETS-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: three nuggets cluster -->
  <g class="NUGGETS-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(112,155)"><path d="M-18 10 C-28 0 -24 -18 -8 -22 C2 -32 22 -32 30 -22 C46 -18 48 0 38 10 C32 22 -8 22 -18 10 Z"/></g>
    <g transform="translate(150,118)"><path d="M-18 10 C-28 0 -24 -18 -8 -22 C2 -32 22 -32 30 -22 C46 -18 48 0 38 10 C32 22 -8 22 -18 10 Z"/></g>
    <g transform="translate(92,100)"><path d="M-18 10 C-28 0 -24 -18 -8 -22 C2 -32 22 -32 30 -22 C46 -18 48 0 38 10 C32 22 -8 22 -18 10 Z"/></g>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#NUGGETS-clip)">
    <rect class="NUGGETS-sweep" x="0" y="0" width="80" height="256" fill="url(#NUGGETS-sweep)"/>
  </g>
</svg>
