<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Daytona">
  <defs>
    <linearGradient id="DAYTONA-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6D365"/>
      <stop offset="1" stop-color="#7C5A0B"/>
    </linearGradient>
    <linearGradient id="DAYTONA-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="DAYTONA-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="DAYTONA-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="DAYTONA-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .DAYTONA-sweep { animation: DAYTONA-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes DAYTONA-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .DAYTONA-second { transform-origin: 128px 128px; animation: DAYTONA-tick 6s steps(8) infinite; }
    @keyframes DAYTONA-tick { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .DAYTONA-sweep, .DAYTONA-second { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#DAYTONA-bg)" filter="url(#DAYTONA-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#DAYTONA-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph -->
  <circle cx="128" cy="128" r="46" fill="none" stroke="#FFFFFF" stroke-width="12"/>
  <circle cx="106" cy="118" r="12" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <circle cx="150" cy="118" r="12" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <circle cx="128" cy="150" r="12" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <g class="DAYTONA-hands" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round">
    <line x1="128" y1="128" x2="128" y2="96"/>
    <line x1="128" y1="128" x2="152" y2="128"/>
  </g>
  <g class="DAYTONA-second">
    <line x1="128" y1="128" x2="128" y2="88" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>
  <circle cx="128" cy="128" r="6" fill="#FFFFFF"/>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#DAYTONA-clip)">
    <rect class="DAYTONA-sweep" x="0" y="0" width="80" height="256" fill="url(#DAYTONA-sweep)"/>
  </g>
</svg>
