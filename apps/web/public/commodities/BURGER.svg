<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Burger">
  <defs>
    <linearGradient id="BURGER-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF6B2C"/>
    </linearGradient>
    <linearGradient id="BURGER-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="BURGER-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="BURGER-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="BURGER-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .BURGER-sweep { animation: BURGER-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes BURGER-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .BURGER-glyph { transform-origin: 128px 68px; animation: BURGER-steam 3s ease-in-out infinite; }
    @keyframes BURGER-steam { 0%, 100% { transform: translateY(0); opacity: 0.9; } 50% { transform: translateY(-6px); opacity: 0.45; } }
    @media (prefers-reduced-motion: reduce) { .BURGER-sweep, .BURGER-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#BURGER-bg)" filter="url(#BURGER-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#BURGER-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: single-patty burger: bun/patty/bun -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M74 118 Q128 80 182 118"/>
    <circle cx="114" cy="98" r="4" fill="#FFFFFF" fill-opacity="0.9" stroke="none"/>
    <circle cx="142" cy="100" r="4" fill="#FFFFFF" fill-opacity="0.9" stroke="none"/>
    <path d="M70 142 Q100 152 128 142 Q156 132 186 142"/>
    <path d="M70 156 Q100 146 128 156 Q156 166 186 156"/>
    <path d="M74 168 H182"/>
    <path d="M70 168 Q128 200 186 168"/>
  </g>
  <g class="BURGER-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M112 78 C108 70 116 66 112 58"/>
    <path d="M144 78 C140 70 148 66 144 58"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#BURGER-clip)">
    <rect class="BURGER-sweep" x="0" y="0" width="80" height="256" fill="url(#BURGER-sweep)"/>
  </g>
</svg>
