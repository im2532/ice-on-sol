<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Platinum">
  <defs>
    <linearGradient id="XPT-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9DDE7"/>
      <stop offset="1" stop-color="#6C7590"/>
    </linearGradient>
    <linearGradient id="XPT-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="XPT-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="XPT-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="XPT-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .XPT-sweep { animation: XPT-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes XPT-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .XPT-glyph { animation: none; }
    .XPT-glint { animation: XPT-shine 3s ease-in-out infinite; }
    @keyframes XPT-shine { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.95; } }
    @media (prefers-reduced-motion: reduce) { .XPT-sweep, .XPT-glyph, .XPT-glint { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#XPT-bg)" filter="url(#XPT-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#XPT-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: bold cut-gem crown over inverted pavilion with facet lines -->
  <g class="XPT-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M72 84 H184 L158 128 H98 Z"/>
    <path d="M98 128 L158 128 L128 188 Z"/>
    <path d="M128 84 L128 188"/>
    <path d="M72 84 L98 128"/>
    <path d="M184 84 L158 128"/>
    <path class="XPT-glint" d="M84 96 L146 148" stroke-width="8" opacity="0.6"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#XPT-clip)">
    <rect class="XPT-sweep" x="0" y="0" width="80" height="256" fill="url(#XPT-sweep)"/>
  </g>
</svg>
