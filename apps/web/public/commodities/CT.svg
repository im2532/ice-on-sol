<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Cotton">
  <defs>
    <linearGradient id="CT-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="CT-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="CT-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="CT-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="CT-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .CT-sweep { animation: CT-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes CT-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .CT-glyph { transform-origin: 128px 198px; animation: CT-sway 3.8s ease-in-out infinite; }
    @keyframes CT-sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .CT-sweep, .CT-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#CT-bg)" filter="url(#CT-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#CT-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: cotton boll: 3 rounded lobes on stem -->
  <g class="CT-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 198 L128 160"/>
    <path d="M110 158 L128 148 L146 158"/>
    <circle cx="108" cy="138" r="30"/>
    <circle cx="148" cy="138" r="30"/>
    <circle cx="128" cy="108" r="30"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#CT-clip)">
    <rect class="CT-sweep" x="0" y="0" width="80" height="256" fill="url(#CT-sweep)"/>
  </g>
</svg>
