<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Soybean Oil">
  <defs>
    <linearGradient id="ZL-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B7F27B"/>
      <stop offset="1" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="ZL-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="ZL-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ZL-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="ZL-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .ZL-sweep { animation: ZL-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes ZL-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .ZL-glyph { transform-origin: 170px 100px; animation: ZL-drip 2.6s ease-in-out infinite; }
    @keyframes ZL-drip { 0%, 100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(10px); opacity: 0.5; } }
    @media (prefers-reduced-motion: reduce) { .ZL-sweep, .ZL-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#ZL-bg)" filter="url(#ZL-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#ZL-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: bottle with drop -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M118 70 H138 V90 C150 96 158 110 158 130 V180 C158 190 150 196 138 196 H118 C106 196 98 190 98 180 V130 C98 110 106 96 118 90 Z"/>
  </g>
  <g class="ZL-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 84 C165 92 161 99 161 105 C161 112 165 116 170 116 C175 116 179 112 179 105 C179 99 175 92 170 84 Z"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#ZL-clip)">
    <rect class="ZL-sweep" x="0" y="0" width="80" height="256" fill="url(#ZL-sweep)"/>
  </g>
</svg>
