<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Palladium">
  <defs>
    <linearGradient id="XPD-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9DDE7"/>
      <stop offset="1" stop-color="#6C7590"/>
    </linearGradient>
    <linearGradient id="XPD-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="XPD-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="XPD-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="XPD-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .XPD-sweep { animation: XPD-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes XPD-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .XPD-glyph { transform-origin: 128px 128px; animation: XPD-pulse 3.6s ease-in-out infinite; }
    @keyframes XPD-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    @media (prefers-reduced-motion: reduce) { .XPD-sweep, .XPD-glyph { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#XPD-bg)" filter="url(#XPD-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#XPD-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: hexagonal nugget with facets -->
  <g class="XPD-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 72 L178 100 L178 156 L128 184 L78 156 L78 100 Z"/>
    <path d="M128 72 L128 184"/>
    <path d="M78 100 L128 128 L178 100"/>
    <path d="M78 156 L128 128 L178 156"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#XPD-clip)">
    <rect class="XPD-sweep" x="0" y="0" width="80" height="256" fill="url(#XPD-sweep)"/>
  </g>
</svg>
