<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Feeder Cattle">
  <defs>
    <linearGradient id="GF-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB4C6"/>
      <stop offset="1" stop-color="#B23A5E"/>
    </linearGradient>
    <linearGradient id="GF-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="GF-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="GF-clip"><rect x="8" y="8" width="240" height="240" rx="64"/></clipPath>
    <filter id="GF-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .GF-sweep { animation: GF-sweep 6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes GF-sweep { 0%, 55% { transform: translateX(-260px) skewX(-20deg); } 100% { transform: translateX(300px) skewX(-20deg); } }
    .GF-glyph { animation: none; }
    .GF-ear { animation: GF-flop 3.2s ease-in-out infinite; }
    @keyframes GF-flop { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(8deg); } }
    @media (prefers-reduced-motion: reduce) { .GF-sweep, .GF-glyph, .GF-ear { animation: none; } }
  </style>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#GF-bg)" filter="url(#GF-shadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#GF-gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- glyph: rounder calf head, floppy ears, tuft, big eyes, no horns -->
  <g class="GF-glyph" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="128" cy="132" rx="50" ry="46"/>
    <path class="GF-ear" d="M84 108 Q58 122 68 154" style="transform-origin:84px 108px;"/>
    <path class="GF-ear" d="M172 108 Q198 122 188 154" style="transform-origin:172px 108px;"/>
    <path d="M116 66 L112 82"/>
    <path d="M128 62 L128 80"/>
    <path d="M140 66 L144 82"/>
    <circle cx="110" cy="124" r="8" fill="#FFFFFF" stroke="none"/>
    <circle cx="146" cy="124" r="8" fill="#FFFFFF" stroke="none"/>
  </g>

  <!-- specular sweep (always last, clipped to the badge) -->
  <g clip-path="url(#GF-clip)">
    <rect class="GF-sweep" x="0" y="0" width="80" height="256" fill="url(#GF-sweep)"/>
  </g>
</svg>
