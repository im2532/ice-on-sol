[toolchain]
anchor_version = "0.31.1"
solana_version = "2.1.21"

[features]
resolution = true
skip-lint = false

[programs.localnet]
peg_desk = "PegDesk111111111111111111111111111111111111"
fee_router = "FeeRoutr111111111111111111111111111111111111"
distributor = "Distrib1111111111111111111111111111111111111"
buyback = "Buyback1111111111111111111111111111111111111"

[programs.devnet]
peg_desk = "PegDesk111111111111111111111111111111111111"
fee_router = "FeeRoutr111111111111111111111111111111111111"
distributor = "Distrib1111111111111111111111111111111111111"
buyback = "Buyback1111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.test.ts"

# Mainnet programs cloned into the local validator so CPI tests hit real bytecode.
[test]
startup_wait = 20000

[test.validator]
url = "https://api.mainnet-beta.solana.com"
bind_address = "0.0.0.0"
ledger = ".anchor/test-ledger"

