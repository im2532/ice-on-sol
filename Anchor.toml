[toolchain]
anchor_version = "0.31.1"
# Must be pinned: the avm proxy otherwise maps Anchor 0.31.1 -> Solana 2.1.0, whose
# platform-tools cargo (1.79) cannot parse edition-2024 crates. 4.2.2 is the Agave stable
# release; both avm and anchor-cli install/activate it via `agave-install init` if needed.
# NOTE: `anchor keys sync` re-serializes this file and drops comments; re-add them after running it.
solana_version = "4.2.2"

[features]
resolution = true
skip-lint = false

[programs.devnet]
buyback = "2jsn1m1EnUx2AixWn8KSvWa7bqgQJrLqr2pQenzok4Lk"
distributor = "AEGw9dc3MUYR3aJXzZJjQmQDsJBJuT1RfsjoByNv4dV6"
fee_router = "9bnCKVesMxQPDaWAmiT21vaES2QgtdXinfXciTCZrbEt"
peg_desk = "6jMv6pdi3nB4RRmJSojDy2cHRLMgKNM3ZEeJFngWrqQN"

[programs.localnet]
buyback = "2jsn1m1EnUx2AixWn8KSvWa7bqgQJrLqr2pQenzok4Lk"
distributor = "AEGw9dc3MUYR3aJXzZJjQmQDsJBJuT1RfsjoByNv4dV6"
fee_router = "9bnCKVesMxQPDaWAmiT21vaES2QgtdXinfXciTCZrbEt"
peg_desk = "6jMv6pdi3nB4RRmJSojDy2cHRLMgKNM3ZEeJFngWrqQN"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.test.ts"

# Mainnet programs cloned into the local validator so CPI tests hit real bytecode.
[test]
startup_wait = 20000
shutdown_wait = 2000
# true: the test validator / anchor localnet load programs as upgradeable with the wallet as authority; every
# `initialize` now requires the upgrade authority to sign (audit F-08), so false would fail every init.
upgradeable = true

[test.validator]
# Agave 4.x rejects 0.0.0.0 (UnspecifiedIpAddr panic in gossip); Anchor defaults to it, so pin loopback.
bind_address = "127.0.0.1"
url = "https://api.mainnet-beta.solana.com"
ledger = ".anchor/test-ledger"
rpc_port = 8899

# Meteora Dynamic Bonding Curve
[[test.validator.clone]]
address = "dbcij3LWUppWqq96dh6gJWwBifmcGfLSB5D4DuSMaqN"

# Meteora DAMM v2 (cp-amm)
[[test.validator.clone]]
address = "cpamdpZCGKUy5JxQXB4dcpGPiikHawvSWAd6mEn1sGG"

# Pyth Solana Receiver
[[test.validator.clone]]
address = "rec5EKMGg6MxZYaMdyBfgwp4d5rB9T1VQH5pJv5LtFJ"

# Pyth Wormhole receiver
[[test.validator.clone]]
address = "HDwcJBJXjL9FpJ7UBsYBtaDjsBUhuLCUYoz3zr8SWWaQ"

# Meteora DAMM v2 migration config for MigrationFeeOption::Customizable (DAMM_V2_MIGRATION_FEE_ADDRESS[6]);
# migrate_damm_v2 reads it, so localnet needs the account, not just the programs.
[[test.validator.clone]]
address = "A8gMrEPJkacWkcb3DGwtJwTe16HktSEfvwtuDh2MCtck"
# Metaplex Token Metadata
[[test.validator.clone]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"

